{% extends "base.html" %}

{% block title %}Interviewer AI{% endblock %}

{% block content %}
<div class="card">
    <h1>Interviewer AI</h1>
    <p class="subtitle">
        An AI-powered autonomous interview experience
    </p>

    <textarea
        id="jdInput"
        placeholder="Paste Job Description here..."
        style="width:100%;height:150px;border-radius:12px;padding:12px;margin-bottom:20px;">
    </textarea>

    <button class="start-btn" onclick="startInterview()">
        Start Interview
    </button>
    <button class="start-btn" onclick="window.location.href='/chat'">
        Start Voice Chat
    </button>
</div>

<script src="/static/js/main.js"></script>
{% endblock %}
